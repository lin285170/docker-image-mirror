name: Pre-download Config

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Profile ID to download'
        required: true
        default: '88bdbce5034ea688e4117ee248406d11fe766bb080ec32243450327f2febf490'
      new_tag:
        description: 'New image tag for pre-download image'
        required: true
        default: '2.1.2-variant-predownload'

permissions:
  packages: write
  contents: read

env:
  BASE_IMAGE: ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant

jobs:
  predownload:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (aggressive)
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /usr/share/miniconda /opt/az 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull $BASE_IMAGE

      - name: Run download-to-cache (skip weights via size monitor)
        id: download
        continue-on-error: true
        run: |
          mkdir -p ./nim-cache
          # Fix ownership: NIM container runs as UID 1000 GID 1000
          sudo chown -R 1000:1000 ./nim-cache
          sudo chmod -R 755 ./nim-cache

          echo "=== Starting download-to-cache ==="
          echo "Profile: ${{ inputs.profile_id }}"
          echo "Strategy: poll every 1s, kill when total cache > 200MB"

          # Launch download in background
          docker run --rm \
            -e NGC_API_KEY=${{ secrets.NGC_API_KEY }} \
            -v "$(pwd)/nim-cache:/opt/nim/.cache" \
            $BASE_IMAGE \
            download-to-cache -p ${{ inputs.profile_id }} > download.log 2>&1 &
          DOWNLOAD_PID=$!

          # Poll every 1s; kill if total cache size exceeds 200MB or after 10 min
          THRESHOLD_MB=200
          for i in $(seq 1 600); do
            if ! kill -0 $DOWNLOAD_PID 2>/dev/null; then
              echo "Download process finished on its own"
              break
            fi
            CACHE_SIZE=$(du -sm ./nim-cache 2>/dev/null | cut -f1)
            CACHE_SIZE=${CACHE_SIZE:-0}
            if [ "$CACHE_SIZE" -gt "$THRESHOLD_MB" ]; then
              echo "⚠️  Cache size ${CACHE_SIZE}MB exceeds ${THRESHOLD_MB}MB threshold"
              echo "Killing download to skip model weights..."
              kill $DOWNLOAD_PID 2>/dev/null
              sleep 1
              kill -9 $DOWNLOAD_PID 2>/dev/null
              docker ps -q | xargs -r docker stop 2>/dev/null || true
              break
            fi
            sleep 1
          done

          wait $DOWNLOAD_PID 2>/dev/null || true

          echo ""
          echo "=== Download log (last 40 lines) ==="
          tail -40 download.log || true

      - name: Show downloaded files
        run: |
          echo "=== All files in cache ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found"
          echo ""
          echo "=== Directory structure ==="
          find ./nim-cache -type d 2>/dev/null | head -30
          echo ""
          echo "=== Total cache size ==="
          du -sh ./nim-cache 2>/dev/null || echo "Empty cache"

      - name: Remove weight files and verify
        run: |
          echo "=== Removing .safetensors files ==="
          find ./nim-cache -name "*.safetensors" -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing any file > 100MB ==="
          find ./nim-cache -type f -size +100M -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing incomplete .tmp / .partial files ==="
          find ./nim-cache \( -name "*.tmp" -o -name "*.partial" -o -name "*.lock" -o -name "*.incomplete" \) -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Final cache contents ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files"
          echo ""
          du -sh ./nim-cache 2>/dev/null

      - name: Clean up Docker and check disk
        run: |
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== Disk space ==="
          df -h /

      - name: Build pre-download image
        run: |
          mkdir -p ./nim-cache
          cat > Dockerfile <<'DOCKEREOF'
          FROM ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant
          COPY --chown=nvs:nvs nim-cache/ /opt/nim/.cache/
          DOCKEREOF

          echo "=== Building image ==="
          docker build \
            -t ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }} \
            .

      - name: Push image
        run: |
          echo "=== Pushing image ==="
          docker push ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}

      - name: Summary
        run: |
          echo "============================================"
          echo "Pre-download image pushed"
          echo ""
          echo "Image: ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}"
          echo ""
          echo "Cache directory structure:"
          find ./nim-cache -type d 2>/dev/null
          echo ""
          echo "Config files included:"
          find ./nim-cache -type f 2>/dev/null
          echo "============================================"
