name: Pre-download Config

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Profile ID to download'
        required: true
        default: '88bdbce5034ea688e4117ee248406d11fe766bb080ec32243450327f2febf490'
      new_tag:
        description: 'New image tag for pre-download image'
        required: true
        default: '2.1.2-variant-predownload'

permissions:
  packages: write
  contents: read

env:
  BASE_IMAGE: ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant

jobs:
  predownload:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull $BASE_IMAGE

      - name: Show download-to-cache help
        continue-on-error: true
        run: |
          echo "=== download-to-cache --help ==="
          docker run --rm $BASE_IMAGE download-to-cache --help 2>&1 || true

      - name: Run download-to-cache (skip weights via size monitor)
        id: download
        continue-on-error: true
        run: |
          mkdir -p ./nim-cache

          echo "=== Starting download-to-cache ==="
          echo "Profile: ${{ inputs.profile_id }}"
          echo "Strategy: monitor file sizes, kill when any file exceeds 500MB"

          # Launch download in background
          docker run --rm \
            -e NGC_API_KEY=${{ secrets.NGC_API_KEY }} \
            -v "$(pwd)/nim-cache:/opt/nim/.cache" \
            $BASE_IMAGE \
            download-to-cache -p ${{ inputs.profile_id }} > download.log 2>&1 &
          DOWNLOAD_PID=$!

          # Poll every 3s; kill if a large file appears or after 10 min
          for i in $(seq 1 200); do
            if ! kill -0 $DOWNLOAD_PID 2>/dev/null; then
              echo "Download process finished on its own"
              break
            fi
            LARGE_FILE=$(find ./nim-cache -type f -size +500M 2>/dev/null | head -1)
            if [ -n "$LARGE_FILE" ]; then
              echo "⚠️  Large file detected: $LARGE_FILE"
              echo "Killing download to skip model weights..."
              kill $DOWNLOAD_PID 2>/dev/null
              sleep 2
              kill -9 $DOWNLOAD_PID 2>/dev/null
              # Stop any lingering containers
              docker ps -q | xargs -r docker stop 2>/dev/null || true
              break
            fi
            sleep 3
          done

          wait $DOWNLOAD_PID 2>/dev/null || true

          echo ""
          echo "=== Download log (last 40 lines) ==="
          tail -40 download.log || true

      - name: Show downloaded files
        run: |
          echo "=== All files in cache ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found"
          echo ""
          echo "=== Directory structure ==="
          find ./nim-cache -type d 2>/dev/null | head -30
          echo ""
          echo "=== Total cache size ==="
          du -sh ./nim-cache 2>/dev/null || echo "Empty cache"

      - name: Remove weight files and verify
        run: |
          echo "=== Removing .safetensors files ==="
          find ./nim-cache -name "*.safetensors" -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing any file > 500MB ==="
          find ./nim-cache -type f -size +500M -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing incomplete .tmp / .partial files ==="
          find ./nim-cache \( -name "*.tmp" -o -name "*.partial" -o -name "*.lock" \) -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Final cache contents ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files"
          echo ""
          du -sh ./nim-cache 2>/dev/null

      - name: Check disk space
        run: df -h /

      - name: Build pre-download image
        run: |
          # Ensure nim-cache dir exists even if empty
          mkdir -p ./nim-cache

          cat > Dockerfile <<'DOCKEREOF'
          FROM ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant
          COPY --chown=nvs:nvs nim-cache/ /opt/nim/.cache/
          DOCKEREOF

          echo "=== Building image ==="
          docker build \
            -t ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }} \
            .

      - name: Push image
        run: |
          echo "=== Pushing image ==="
          docker push ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}

      - name: Summary
        run: |
          echo "============================================"
          echo "✅ Pre-download image pushed"
          echo ""
          echo "Image: ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}"
          echo ""
          echo "Cache directory structure:"
          find ./nim-cache -type d 2>/dev/null
          echo ""
          echo "Config files included:"
          find ./nim-cache -type f 2>/dev/null
          echo ""
          echo "============================================"
          echo "本地使用方法："
          echo ""
          echo "1. 拉取镜像："
          echo "   docker pull ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}"
          echo ""
          echo "2. 查看镜像内缓存结构："
          echo "   docker run --rm --entrypoint find ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }} /opt/nim/.cache -type f"
          echo ""
          echo "3. 运行（需要代理用于 filemap 检查，权重挂载到对应目录）："
          echo "   docker run --gpus all \\"
          echo "     -e NGC_API_KEY=你的KEY \\"
          echo "     -e HTTPS_PROXY=http://代理:端口 \\"
          echo "     -v /本地权重目录:/opt/nim/.cache/对应路径 \\"
          echo "     -p 8000:8000 \\"
          echo "     ghcr.io/lin285170/nim-meta-muse-glimmer:${{ inputs.new_tag }}"
          echo "============================================"
