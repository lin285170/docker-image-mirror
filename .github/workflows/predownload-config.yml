name: Pre-download Config

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Profile ID to download'
        required: true
        default: '88bdbce5034ea688e4117ee248406d11fe766bb080ec32243450327f2febf490'

permissions:
  packages: read
  contents: read

env:
  BASE_IMAGE: ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant

jobs:
  predownload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /usr/share/miniconda /opt/az 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          df -h /

      - name: Pull base image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull $BASE_IMAGE

      - name: Run download-to-cache with size limit
        continue-on-error: true
        run: |
          mkdir -p ./nim-cache
          sudo chown -R 1000:1000 ./nim-cache
          sudo chmod 777 ./nim-cache

          echo "=== Running download-to-cache with 120s timeout ==="

          # Run download in background with output to log
          timeout 120 docker run --rm \
            -e NGC_API_KEY=${{ secrets.NGC_API_KEY }} \
            -v "$(pwd)/nim-cache:/opt/nim/.cache" \
            $BASE_IMAGE \
            download-to-cache -p ${{ inputs.profile_id }} > download.log 2>&1 &
          DL_PID=$!

          # Monitor cache size every 1s, kill if > 100MB
          for i in $(seq 1 130); do
            if ! kill -0 $DL_PID 2>/dev/null; then
              echo "Download process finished"
              break
            fi
            CACHE_MB=$(du -sm ./nim-cache 2>/dev/null | cut -f1)
            CACHE_MB=${CACHE_MB:-0}
            if [ "$CACHE_MB" -gt 100 ]; then
              echo "Cache hit ${CACHE_MB}MB, killing download..."
              kill -9 $DL_PID 2>/dev/null || true
              break
            fi
            sleep 1
          done

          # Force kill any lingering containers (don't use wait - it can hang)
          kill -9 $DL_PID 2>/dev/null || true
          docker kill $(docker ps -q) 2>/dev/null || true
          docker rm -f $(docker ps -aq) 2>/dev/null || true

          echo "=== Download log ==="
          cat download.log

      - name: Show and clean cache
        run: |
          echo "=== All files ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files"
          echo ""
          echo "=== Removing weights and large files ==="
          find ./nim-cache -name "*.safetensors" -exec rm -v {} \; 2>/dev/null || true
          find ./nim-cache -type f -size +100M -exec rm -v {} \; 2>/dev/null || true
          find ./nim-cache \( -name "*.tmp" -o -name "*.partial" -o -name "*.lock" \) -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Final files ==="
          find ./nim-cache -type f 2>/dev/null || echo "No files"
          du -sh ./nim-cache 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nim-config-cache
          path: nim-cache/
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "============================================"
          echo "Artifact: nim-config-cache"
          echo "Files:"
          find ./nim-cache -type f 2>/dev/null || echo "(empty)"
          echo ""
          echo "Download with:"
          echo "  gh run download <run-id> --repo lin285170/docker-image-mirror -n nim-config-cache"
          echo "============================================"
