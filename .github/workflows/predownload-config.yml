name: Pre-download Config

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Profile ID to download'
        required: true
        default: '88bdbce5034ea688e4117ee248406d11fe766bb080ec32243450327f2febf490'

permissions:
  packages: read
  contents: read

env:
  BASE_IMAGE: ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant

jobs:
  predownload:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (aggressive)
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /usr/share/miniconda /opt/az 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull $BASE_IMAGE

      - name: Run download-to-cache (skip weights via size monitor)
        id: download
        continue-on-error: true
        run: |
          mkdir -p ./nim-cache
          sudo chown -R 1000:1000 ./nim-cache
          sudo chmod -R 755 ./nim-cache

          echo "=== Starting download-to-cache ==="
          echo "Profile: ${{ inputs.profile_id }}"
          echo "Strategy: poll every 1s, kill when total cache > 100MB"

          docker run --rm \
            -e NGC_API_KEY=${{ secrets.NGC_API_KEY }} \
            -v "$(pwd)/nim-cache:/opt/nim/.cache" \
            $BASE_IMAGE \
            download-to-cache -p ${{ inputs.profile_id }} > download.log 2>&1 &
          DOWNLOAD_PID=$!

          THRESHOLD_MB=100
          for i in $(seq 1 600); do
            if ! kill -0 $DOWNLOAD_PID 2>/dev/null; then
              echo "Download process finished on its own"
              break
            fi
            CACHE_SIZE=$(du -sm ./nim-cache 2>/dev/null | cut -f1)
            CACHE_SIZE=${CACHE_SIZE:-0}
            if [ "$CACHE_SIZE" -gt "$THRESHOLD_MB" ]; then
              echo "Cache size ${CACHE_SIZE}MB exceeds ${THRESHOLD_MB}MB threshold"
              echo "Killing download to skip model weights..."
              kill $DOWNLOAD_PID 2>/dev/null
              sleep 1
              kill -9 $DOWNLOAD_PID 2>/dev/null
              docker ps -q | xargs -r docker stop 2>/dev/null || true
              break
            fi
            sleep 1
          done

          wait $DOWNLOAD_PID 2>/dev/null || true

          echo ""
          echo "=== Download log (last 50 lines) ==="
          tail -50 download.log || true

      - name: Show downloaded files
        run: |
          echo "=== All files in cache ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found"
          echo ""
          echo "=== Directory structure ==="
          find ./nim-cache -type d 2>/dev/null | head -30
          echo ""
          echo "=== Total cache size ==="
          du -sh ./nim-cache 2>/dev/null || echo "Empty cache"

      - name: Remove weight files
        run: |
          echo "=== Removing .safetensors files ==="
          find ./nim-cache -name "*.safetensors" -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing any file > 100MB ==="
          find ./nim-cache -type f -size +100M -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Removing incomplete files ==="
          find ./nim-cache \( -name "*.tmp" -o -name "*.partial" -o -name "*.lock" -o -name "*.incomplete" \) -type f -exec rm -v {} \; 2>/dev/null || true
          echo ""
          echo "=== Final cache contents ==="
          find ./nim-cache -type f -exec ls -lh {} \; 2>/dev/null || echo "No files"
          echo ""
          du -sh ./nim-cache 2>/dev/null

      - name: Compress cache for artifact
        run: |
          cd nim-cache
          tar czf ../nim-config-cache.tar.gz .
          cd ..
          ls -lh nim-config-cache.tar.gz

      - name: Upload config cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: nim-config-cache
          path: nim-config-cache.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "============================================"
          echo "Config cache uploaded as GitHub Actions artifact"
          echo ""
          echo "Artifact: nim-config-cache"
          echo "Contents:"
          find ./nim-cache -type f 2>/dev/null || echo "(empty)"
          echo ""
          echo "============================================"
          echo "本地使用方法："
          echo ""
          echo "1. 下载 artifact："
          echo "   gh run download <run-id> --repo lin285170/docker-image-mirror -n nim-config-cache"
          echo ""
          echo "2. 解压到本地目录："
          echo "   mkdir -p /opt/nim/.cache"
          echo "   tar xzf nim-config-cache.tar.gz -C /opt/nim/.cache"
          echo ""
          echo "3. 运行容器（挂载缓存 + 本地权重）："
          echo "   docker run --gpus all \\"
          echo "     -v /opt/nim/.cache:/opt/nim/.cache \\"
          echo "     -p 8000:8000 \\"
          echo "     ghcr.io/lin285170/nim-meta-muse-glimmer:2.1.2-variant"
          echo "============================================"
